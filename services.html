    <script>
        // ===== Analytics Configuration =====
        const ANALYTICS_CONFIG = {
            supabaseUrl: 'https://your-project-id.supabase.co',
            supabaseKey: 'sb_publishable_REPLACE_WITH_YOUR_SUPABASE_ANON_KEY',
            sessionTimeout: 30 * 60 * 1000,
            scrollThresholds: [25, 50, 75, 100]
        };

        let analyticsState = { isTracking: false };
        let supabaseAnalyticsClient = null;
        let supabaseClient = null;

        // ===== Config (loaded from config.json) =====
        let CONFIG = {
            stripe: { publishableKey: '' },
            supabase: { url: '', anonKey: '' },
            business: { phone: '447767972498', siteUrl: '' },
            payment: { depositPercent: 25, currency: 'gbp' }
        };

        function isPlaceholder(value) {
            return !value || String(value).includes('YOUR_') || String(value).includes('REPLACE_WITH');
        }

        async function loadConfig() {
            try {
                const res = await fetch('/config.json');
                if (res.ok) {
                    CONFIG = await res.json();
                    if (isPlaceholder(CONFIG?.supabase?.url) || isPlaceholder(CONFIG?.supabase?.anonKey)) {
                        console.warn('Supabase config is not yet live. Analytics are disabled until values are configured.');
                        CONFIG.supabase = { url: '', anonKey: '' };
                    }
                }
            } catch (e) {
                console.warn('config.json not found, using defaults');
            }
        }
